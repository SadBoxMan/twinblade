# Overlay 0x3A: the cut legend prologue (retail-era build, unreachable).
# MAIN.CD entry 7, a raw payload (no PAC header; tools/extract_overlays.py -> disc/overlays/code/ovl3a.bin)
# for the mode-overlay slot 0x800CEDF8; nothing loads it (docs/cut_prologue.md).
name: Overlay 0x3A (cut legend prologue)
sha1: 2ff702b605ab5cfc18474c464c4c07e5f8ffd48c
options:
  basename: ovl3a
  target_path: disc/overlays/code/ovl3a.bin
  elf_path: build/ovl3a/ovl3a.elf
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm/ovl3a
  src_path: src/ovl3a
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/ovl3a/ovl3a.ld
  ld_dependencies: True
  ld_bss_is_noload: True
  ld_align_section_vram_end: False

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.txt
    - symbol_addrs_psyq.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: build/ovl3a/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/ovl3a/undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl3a
    type: code
    start: 0x0
    vram: 0x800CEDF8
    subsegments:
      - [0x0, rodata, ovl3a_id]     # u32 overlay ID (0x3A)
      - [0x4, rodata, ovl3a_rodata] # the picture packs' paths
      - [0x34, c, ovl3a]
      - [0xCBC, data, ovl3a_data]
  - [0x2580]
