# Package 0x2D: ability 28, Homing (generated by tools/gen_ability_ovls.py; edit the generator, not this file).
# MAIN.CD entry 39, the code block of its PAC package (tools/extract_overlays.py -> disc/overlays/code/ovl2d.bin),
# copied to overlay slot 2 at 0x800CAE08. Symbols carry the package ID (func_ovl2d_800CAE0C): the packages share
# their slot's address.
name: Package 0x2D (ability 28, Homing)
sha1: cb042f2e844b968eb03ca694b93aa082099fce29
options:
  basename: ovl2d
  target_path: disc/overlays/code/ovl2d.bin
  elf_path: build/abil/ovl2d/ovl2d.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/abil/ovl2d
  src_path: src/abil
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/abil/ovl2d/ovl2d.ld
  ld_dependencies: True
  ld_bss_is_noload: True
  ld_align_section_vram_end: False

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_name_format: ovl2d_$VRAM
  symbol_name_format_no_rom: ovl2d_$VRAM

  symbol_addrs_path:
    - symbol_addrs.txt
    - symbol_addrs_psyq.txt
    - abil/symbol_addrs_ovl2d.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: build/abil/ovl2d/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/abil/ovl2d/undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl2d
    type: code
    start: 0x0
    vram: 0x800CAE08
    subsegments:
      - [0x0, rodata, ovl2d_id]     # u32 overlay ID (0x2D)
      - {start: 0x4, type: data, name: ovl2d_rodata, linker_section_order: .rodata} # data in front of the code (as data: a rodata jump table's cases would be .L labels, docs/decomp_recipes.md 7)
      - [0xC, c, ovl2d]            # entry 0x800CAE14
      - [0x102C, data, ovl2d_data]
  - [0x1644]
