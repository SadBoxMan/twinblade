# Package 0x1A: ability 12, Hop (generated by tools/gen_ability_ovls.py; edit the generator, not this file).
# MAIN.CD entry 20, the code block of its PAC package (tools/extract_overlays.py -> disc/overlays/code/ovl1a.bin),
# copied to overlay slot 2 at 0x800CAE08. Symbols carry the package ID (func_ovl1a_800CAE0C): the packages share
# their slot's address.
name: Package 0x1A (ability 12, Hop)
sha1: 0990e04173c4cfe4cf948e78d5ac4c043c5cb61c
options:
  basename: ovl1a
  target_path: disc/overlays/code/ovl1a.bin
  elf_path: build/abil/ovl1a/ovl1a.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/abil/ovl1a
  src_path: src/abil
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/abil/ovl1a/ovl1a.ld
  ld_dependencies: True
  ld_bss_is_noload: True
  ld_align_section_vram_end: False

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_name_format: ovl1a_$VRAM
  symbol_name_format_no_rom: ovl1a_$VRAM

  symbol_addrs_path:
    - symbol_addrs.txt
    - symbol_addrs_psyq.txt
    - abil/symbol_addrs_ovl1a.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: build/abil/ovl1a/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/abil/ovl1a/undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl1a
    type: code
    start: 0x0
    vram: 0x800CAE08
    subsegments:
      - [0x0, rodata, ovl1a_id]     # u32 overlay ID (0x1A)
      - [0x4, c, ovl1a]            # entry 0x800CAE0C
      - [0x3EC, data, ovl1a_data]
  - [0xCAC]
